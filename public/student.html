<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absen - AbsenKu</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .absen-container {
      max-width: 520px;
      margin: 0 auto;
    }
    .status-card {
      background: white;
      border-radius: var(--radius-lg);
      padding: 24px;
      border: 1px solid var(--gray-200);
      box-shadow: var(--shadow-md);
      margin-bottom: 20px;
    }
    .status-card .status-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .status-card .status-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .status-card .status-icon.done { background: var(--success-bg); }
    .status-card .status-icon.pending { background: var(--gray-100); }
    .status-card .status-detail {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .status-card .detail-box {
      padding: 12px;
      border-radius: var(--radius-sm);
      text-align: center;
    }
    .status-card .detail-box.done { background: var(--success-bg); border: 1px solid #A7F3D0; }
    .status-card .detail-box.waiting { background: var(--gray-50); border: 1px solid var(--gray-200); }
    .status-card .detail-box .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--gray-500);
      margin-bottom: 4px;
    }
    .status-card .detail-box .value {
      font-size: 20px;
      font-weight: 700;
      color: var(--gray-800);
    }
    .status-card .detail-box .photo-thumb {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
      margin-top: 6px;
    }
    .absen-section {
      background: white;
      border-radius: var(--radius-lg);
      padding: 24px;
      border: 1px solid var(--gray-200);
      box-shadow: var(--shadow-md);
    }
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    .btn-absen {
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      border-radius: var(--radius);
    }
    .btn-retake {
      background: var(--gray-600);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
    }
    .history-section {
      margin-top: 20px;
    }
    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid var(--gray-100);
    }
    .history-item:last-child { border-bottom: none; }
    .history-item .history-date {
      font-weight: 600;
      font-size: 13px;
      color: var(--gray-700);
      min-width: 100px;
    }
    .history-item .history-time {
      font-size: 12px;
      color: var(--gray-500);
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="navbar"></div>

    <div class="container">
      <div class="absen-container">
        <div class="page-header" style="text-align:center;">
          <h1>📸 Absen Hari Ini</h1>
          <p id="todayDate"></p>
        </div>

        <!-- Status Card -->
        <div class="status-card" id="statusCard">
          <div class="status-header">
            <div class="status-icon pending" id="statusIcon">⏳</div>
            <div>
              <div style="font-weight:700;font-size:16px;" id="statusTitle">Memuat status...</div>
              <div style="font-size:13px;color:var(--gray-500);" id="statusSubtitle"></div>
            </div>
          </div>
          <div class="status-detail">
            <div class="detail-box waiting" id="boxMasuk">
              <div class="label">Masuk</div>
              <div class="value" id="timeMasuk">--:--</div>
            </div>
            <div class="detail-box waiting" id="boxPulang">
              <div class="label">Pulang</div>
              <div class="value" id="timePulang">--:--</div>
            </div>
          </div>
        </div>

        <!-- Camera Section -->
        <div class="absen-section" id="absenSection">
          <h2 style="font-size:16px;margin-bottom:16px;text-align:center;">📷 Ambil Foto Selfie</h2>

          <!-- Camera View -->
          <div class="camera-container" id="cameraContainer">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            <div class="camera-overlay">
              <button class="btn-capture" id="btnCapture" onclick="capturePhoto()">📸</button>
            </div>
          </div>

          <!-- Photo Preview -->
          <div class="photo-preview" id="photoPreview">
            <img id="previewImg" src="" alt="Preview">
            <div style="text-align:center;padding:12px;">
              <button class="btn-retake" onclick="retakePhoto()">🔄 Ambil Ulang</button>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="btn-group" id="absenButtons" style="display:none;">
            <button class="btn btn-success btn-absen" id="btnCheckin" onclick="doCheckin()">
              ✅ Absen Masuk
            </button>
            <button class="btn btn-primary btn-absen" id="btnCheckout" onclick="doCheckout()">
              🏠 Absen Pulang
            </button>
          </div>

          <!-- Status Pilihan Baru -->
          <div class="mt-4">
            <h5 class="mb-3">Pilih Status Absen</h5>
            <div class="btn-group w-100" role="group">
              <button onclick="doCheckin('sakit')" class="btn btn-info btn-sm">Sakit</button>
              <button onclick="doCheckin('izin')" class="btn btn-secondary btn-sm">Izin</button>
              <button onclick="doCheckin('alpha')" class="btn btn-danger btn-sm">Alpha</button>
            </div>
          </div>

          <!-- Alert -->
          <div id="absenAlert" class="alert" style="display:none;margin-top:12px;"></div>
        </div>

        <!-- History -->
        <div class="history-section">
          <div class="card">
            <div class="card-header">
              <h2>📅 Riwayat Absensi</h2>
            </div>
            <div class="card-body" id="historyList">
              <div class="loading">
                <div class="spinner"></div>
                Memuat...
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/student.js"></script>
</body>
</html>
